<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"/>
    <title>Examen</title>
</head>
<body class="bg-info">
  <div class="container mt-4">
    <div class="row">
      <div class="col-12">
        <h1 class="text-center bg-primary text-white">Noticias</h1>
      </div>
    </div>

    <form id="formBuscar" class="row g-3 mb-4">
      <div class="col-md-6">
        <input type="text" id="parametro" class="form-control" placeholder="Buscar noticias ....">
      </div>

      <div class="col-md-3">
        <input type="date" id="fechafrom" class="form-control">
      </div>

      <div class="col-md-3">
        <input type="date" id="fechato" class="form-control">
      </div>

      <div class="col-12 text-center">
        <button type="submit" id="btnBuscar" class="btn btn-primary">Buscar</button>
      </div>
    </form>

    <div class="row mt-4">
      <div class="col-12">
        <div id="contentData" class="row"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
